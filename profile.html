<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | NOIRÉ Boutique</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="index.html" class="auth-logo">
            NOIRÉ<span>.</span>
        </a>

        <div class="auth-card">

            <div class="auth-heading">

                <p class="eyebrow">
                    YOUR ACCOUNT
                </p>

                <h1>
                    My <span>Profile.</span>
                </h1>

                <p id="profileSubtext">
                    Loading your details...
                </p>

            </div>


            <!-- Shown once we know the user is logged in -->
            <div id="profileContent" style="display: none;">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profileName" disabled>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="profileEmail" disabled>
                </div>

                <div class="form-group">
                    <label>Email Verified</label>
                    <input type="text" id="profileVerified" disabled>
                </div>

                <div class="form-group">
                    <label>Member Since</label>
                    <input type="text" id="profileJoined" disabled>
                </div>

                <button
                    type="button"
                    class="auth-submit"
                    id="resendVerificationBtn">
                    Resend Verification Email
                </button>

                <p class="auth-message" id="profileMessage"></p>

                <div class="auth-divider">
                    <span>ACCOUNT</span>
                </div>

                <button
                    type="button"
                    class="auth-submit"
                    id="profileLogoutBtn"
                    style="background: transparent; color: #b3263e; border: 1px solid #b3263e;">
                    🚪 Log Out
                </button>

            </div>

        </div>


        <a href="index.html" class="back-home">
            ← Back to NOIRÉ
        </a>

    </main>


    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="auth.js"></script>
    <script src="profile.js"></script>

</body>
</html>
